apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin
        image: shivsoftapp/admin-dashbaord:035
        ports:
        - containerPort: 80
