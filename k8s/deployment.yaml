apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard-deployment
  labels:
    app: admin-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
        - name: admin-dashboard-container
          image: shivanitusharsharma/admin-dashbaord:039
          ports:
            - containerPort: 80

